services:
  postgres:
    image: postgres:16-alpine
    container_name: application-service-db
    environment:
      POSTGRES_DB: interntrack
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: interntrack
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interntrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - application-network

  application-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: application-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interntrack
      SPRING_DATASOURCE_USERNAME: interntrack
      SPRING_DATASOURCE_PASSWORD: interntrack
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_SCHEMAS: "public"
      SPRING_FLYWAY_LOCATIONS: "classpath:db/migration"
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - application-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  application-network:
    driver: bridge

